<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="./">
<title>Painel da Loja — configure seu cardápio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4F1; --panel:#fff; --line:#E7E2DA; --ink:#221C19; --soft:#7B6E63;
  --brand:#C0392B; --brand-d:#8E2A20; --gold:#E8A33D; --ok:#3E8E4E; --okbg:#EDF6EE;
  --warnbg:#FDF0EE; --warnline:#F6DCD8; --warnink:#7a3229;
  --okline:#BFE0C6; --okink:#2c5c39;
  --r:14px; --sh:0 6px 20px rgba(60,40,30,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
h1,h2,h3{line-height:1.25}
.disp{font-family:'Anton',Impact,sans-serif;font-weight:400;letter-spacing:.5px}

/* ---------- TOPO ---------- */
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(60,40,30,.05)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:11px 16px}
.top .mark{display:flex;align-items:center;gap:10px;min-width:0}
.top .mark img{width:36px;height:36px;border-radius:9px;object-fit:cover;border:1px solid var(--line);background:#f2ede6}
.top .mark .nm{font-weight:700;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.top .mark .sb{font-size:11.5px;color:var(--soft)}
.top .sp{flex:1}
.btn{border-radius:10px;padding:10px 15px;font-weight:700;font-size:13.5px;white-space:nowrap;transition:.15s;border:1.5px solid transparent}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{background:var(--brand-d)}
.btn-g{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-g:hover{border-color:#cdc5b9}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn-dg{color:var(--brand);background:#fdf0ee;border-color:#f6dcd8}
.estado{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ok);white-space:nowrap}
@media(max-width:700px){.estado{font-size:0;gap:0}.estado span{font-size:15px}}

.ic-btn{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;position:relative;flex:none;transition:.14s}
.ic-btn:hover{background:#F5F2ED}
.ic-btn.mudo{background:#fdf0ee;border-color:#f6dcd8}
.ic-btn .bad{position:absolute;top:-5px;right:-5px;background:var(--brand);color:#fff;font-size:10.5px;font-weight:800;
  border-radius:99px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- PEDIDOS ---------- */
:root{--pd-novo:#E8A33D;--pd-novo-bg:#FFF8EC;--pd-preparo:#2F6FED;--pd-preparo-bg:#EEF3FE;--pd-pronto:#3E8E4E;--pd-pronto-bg:#EDF6EE;--pd-fim:#8A8078;--pd-zap:#25D366}
.abas{padding:0 0 12px}
.abas-in{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.abas-in::-webkit-scrollbar{display:none}
.aba{display:flex;align-items:center;gap:7px;white-space:nowrap;border:1.5px solid var(--line);background:#fff;
  border-radius:99px;padding:9px 16px;font-size:13.5px;font-weight:700;color:var(--soft);transition:.14s}
.aba .n{background:#EFEAE2;color:var(--soft);border-radius:99px;min-width:21px;padding:1px 7px;font-size:11.5px;font-weight:800}
.aba.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.aba.on .n{background:rgba(255,255,255,.22);color:#fff}
.aba.tem-novo{border-color:var(--pd-novo);background:var(--pd-novo-bg);color:#8a5f14}
.aba.tem-novo .n{background:var(--pd-novo);color:#3a2408}
.aba.on.tem-novo{background:var(--pd-novo);color:#3a2408;border-color:var(--pd-novo)}
.aba.on.tem-novo .n{background:rgba(0,0,0,.18);color:#3a2408}
.busca{margin-bottom:14px}
.busca input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff}
.busca input:focus{outline:none;border-color:var(--gold)}
.lista{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.lista{grid-template-columns:1fr 1fr}}
.pd{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;
  border-left:5px solid var(--pd-fim);transition:.16s}
.pd.s-novo{border-left-color:var(--pd-novo)}
.pd.s-preparo{border-left-color:var(--pd-preparo)}
.pd.s-pronto{border-left-color:var(--pd-pronto)}
.pd.piscando{animation:chama 1.5s ease-in-out infinite;border-left-color:var(--pd-novo)}
@keyframes chama{0%,100%{box-shadow:0 4px 16px rgba(50,35,25,.07)}50%{box-shadow:0 0 0 4px rgba(232,163,61,.35),0 4px 20px rgba(232,163,61,.3)}}
.pd-h{display:flex;align-items:flex-start;gap:11px;padding:14px 15px;cursor:pointer}
.pd-h .dot{width:11px;height:11px;border-radius:50%;flex:none;margin-top:5px;background:var(--pd-fim)}
.s-novo .pd-h .dot{background:var(--pd-novo)}
.s-preparo .pd-h .dot{background:var(--pd-preparo)}
.s-pronto .pd-h .dot{background:var(--pd-pronto)}
.pd-h .tt{flex:1;min-width:0}
.pd-h .tt b{font-size:16.5px;font-weight:800;display:block}
.pd-h .tt .sub{font-size:12.5px;color:var(--soft);margin-top:3px}
.pd-h .rt{text-align:right;flex:none}
.pd-h .rt .vl{font-size:17px;font-weight:800;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:700;margin-top:6px}
.tag.ent{background:var(--pd-preparo-bg);color:var(--pd-preparo)}
.tag.ret{background:#F3EFE9;color:#6d6259}
.seta{color:var(--soft);font-size:15px;transition:.2s;flex:none;margin-top:3px}
.pd.aberto .seta{transform:rotate(180deg)}
.pd-b{display:none;padding:0 15px 15px;border-top:1px dashed var(--line);margin-top:2px;padding-top:13px}
.pd.aberto .pd-b{display:block}
.fone{display:flex;align-items:center;gap:10px;background:#FAF8F5;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:11px}
.fone .num{flex:1;font-size:14.5px;font-weight:600;letter-spacing:.2px}
.zap-btn{background:var(--pd-zap);color:#fff;width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;transition:.14s}
.zap-btn:hover{filter:brightness(.94)}
.zap-btn svg{width:22px;height:22px;fill:#fff}
.end{display:flex;gap:8px;font-size:13.5px;color:var(--soft);line-height:1.5;margin-bottom:12px}
.end b{color:var(--ink);font-weight:600}
.itens{border-top:1px solid var(--line);padding-top:11px}
.it{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid #F2EEE8}
.it:last-child{border-bottom:none}
.it .q{background:#EFEAE2;color:var(--ink);font-weight:800;font-size:12.5px;border-radius:8px;min-width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;flex:none;padding:0 6px}
.it .nm{flex:1;min-width:0}
.it .nm b{font-size:14.5px;font-weight:700;display:block}
.it .nm .cfg{font-size:12.5px;color:var(--soft);margin-top:2px;line-height:1.45}
.it .nm .obs{font-size:12.5px;color:#9a5b12;background:#FFF6E8;border-radius:7px;padding:4px 8px;margin-top:5px;display:inline-block}
.it .vl{font-weight:700;font-size:14px;white-space:nowrap}
.somas{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.sm{display:flex;justify-content:space-between;font-size:13.5px;color:var(--soft);margin:4px 0}
.sm.desc{color:var(--pd-pronto);font-weight:600}
.sm.tot{color:var(--ink);font-weight:800;font-size:18px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.pag{display:inline-flex;align-items:center;gap:6px;background:#F3EFE9;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:700;margin-top:10px}
.acoes{display:flex;gap:9px;margin-top:14px}
.ac{flex:1;border-radius:12px;padding:14px;font-weight:800;font-size:15px;text-align:center;transition:.14s}
.ac:active{transform:scale(.98)}
.ac-p{background:var(--ink);color:#fff}
.ac-p:hover{background:#000}
.ac-g{background:#fff;border:1.5px solid var(--line);color:var(--soft);flex:0 0 auto;padding:14px 18px}
.ac-g:hover{border-color:#cfc7bb;color:var(--ink)}
.ac-ok{background:var(--pd-pronto);color:#fff}
.ac-prep{background:var(--pd-preparo);color:#fff}
.pd-vazio{text-align:center;padding:60px 24px;color:var(--soft);grid-column:1/-1}
.pd-vazio .em{font-size:46px;margin-bottom:12px;opacity:.55}
.pd-vazio b{display:block;color:var(--ink);font-size:16.5px;margin-bottom:5px}
.ic-btn .dot{position:absolute;bottom:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--pd-novo);
  border:2px solid #fff;animation:pulsaDot 1.6s infinite}
@keyframes pulsaDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.6}}
.erroPed{background:#FDF0EE;border:1px solid #F3D9D4;color:#8b3226;border-radius:12px;padding:12px 15px;font-size:13.5px;display:none;margin-bottom:12px}
.erroPed.on{display:block}

/* ---------- LAYOUT ---------- */
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:238px 1fr;gap:20px;padding:20px 16px 120px}
@media(max-width:860px){.wrap{grid-template-columns:1fr;padding-bottom:96px}}
#main{min-width:0}
.side{position:sticky;top:74px;align-self:stretch;min-height:calc(100vh - 74px);display:flex;flex-direction:column;gap:4px}
@media(max-width:860px){.side{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:45;flex-direction:row;overflow-x:auto;background:#fff;border-top:1px solid var(--line);padding:6px;gap:2px;scrollbar-width:none;align-self:auto;min-height:0}
 .side::-webkit-scrollbar{display:none}}
.nav-i{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;font-size:14px;font-weight:600;color:var(--soft);text-align:left;transition:.13s;white-space:nowrap}
.nav-i .ic{font-size:17px;line-height:1}
.nav-i:hover{background:#EFEAE3;color:var(--ink)}
.nav-i.on{background:var(--ink);color:#fff}
.nav-i .pend{margin-left:auto;background:var(--gold);color:#3a2408;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 7px}
.nav-i.on .pend{background:var(--gold)}
@media(max-width:860px){.nav-i{flex-direction:column;gap:3px;font-size:10.5px;padding:8px 10px;min-width:66px;justify-content:center;text-align:center}
 .nav-i .ic{font-size:19px}.nav-i .pend{position:absolute;margin:0;transform:translate(16px,-6px)}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:16px}

.subtabs{display:flex;gap:9px;overflow-x:auto;padding:0 20px 20px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:none;display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;
  background:#FBFAF8;text-align:left;transition:.14s;min-width:158px}
.subtab:hover{border-color:#d6cec2}
.subtab .ic{font-size:17px;flex:none}
.subtab .tt b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.subtab .tt small{display:block;font-size:11px;color:var(--soft);margin-top:1px;white-space:nowrap}
.subtab.on{background:#FFF8EC;border-color:var(--gold)}
.subtab.on .tt b{color:#8a5f14}
.subtab.on .tt small{color:#a3782a}
@media(max-width:560px){.subtab{min-width:132px;padding:9px 11px}.subtab .tt small{white-space:normal}}
.card>h2{font-size:19px;font-weight:800;margin-bottom:3px}
.card>.sub{font-size:13.5px;color:var(--soft);line-height:1.5;margin-bottom:16px}

/* ---------- GUIA ---------- */
.guia{display:flex;gap:12px;background:#FFF8EC;border:1px solid #F0DCB0;border-radius:var(--r);padding:14px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.55;color:#5c4726}
.guia .gi{font-size:20px;line-height:1;flex:none}
.guia b{color:#3f3117}
.guia ul{margin:7px 0 0 17px}
.guia li{margin:3px 0}

/* ---------- CAMPOS ---------- */
.f{margin-bottom:15px}
.f>label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;letter-spacing:.2px}
.f .hint{font-size:12px;color:var(--soft);margin-top:5px;line-height:1.45}
.in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;background:#FBFAF8;color:var(--ink);transition:.13s}
.in:focus{outline:none;border-color:var(--gold);background:#fff}
textarea.in{min-height:104px;resize:vertical;line-height:1.55}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:560px){.r2,.r3{grid-template-columns:1fr}}
.pre{display:flex;align-items:stretch}
.pre span{display:flex;align-items:center;padding:0 12px;background:#EFEAE3;border:1.5px solid var(--line);border-right:none;border-radius:10px 0 0 10px;font-size:13.5px;font-weight:600;color:var(--soft)}
.pre .in{border-radius:0 10px 10px 0}

.sw{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:#FBFAF8;margin-bottom:9px;width:100%;text-align:left}
.sw .kn{width:42px;height:24px;border-radius:99px;background:#D8D1C7;flex:none;position:relative;transition:.16s}
.sw .kn::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{border-color:#BFE0C6;background:var(--okbg)}
.sw.on .kn{background:var(--ok)}
.sw.on .kn::after{transform:translateX(18px)}
.sw .tt{flex:1;min-width:0}
.sw .tt b{display:block;font-size:14px;font-weight:600}
.sw .tt small{display:block;font-size:12px;color:var(--soft);margin-top:1px}

.dias{display:flex;gap:7px;flex-wrap:wrap}
.dia{width:46px;height:46px;border-radius:11px;border:1.5px solid var(--line);background:#FBFAF8;font-weight:700;font-size:13px;color:var(--soft);transition:.13s}
.dia.on{background:var(--ok);border-color:var(--ok);color:#fff}

.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.pal button{border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;transition:.13s;text-align:center}
.pal button.on{border-color:var(--ink);box-shadow:0 0 0 3px rgba(34,28,25,.09)}
.pal .bars{display:flex;height:26px;border-radius:7px;overflow:hidden;margin-bottom:7px}
.pal .bars i{flex:1}
.pal .nm{font-size:11.5px;font-weight:700;color:var(--soft)}
.colorline{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:11px;padding:8px 11px;background:#FBFAF8}
.colorline input[type=color]{width:40px;height:34px;border:none;background:none;padding:0;cursor:pointer;border-radius:8px}
.colorline .cl{flex:1;font-size:13px;font-weight:600}
.colorline code{font-size:12px;color:var(--soft);font-family:ui-monospace,monospace}

/* ---------- UPLOAD ---------- */
.up{display:flex;gap:13px;align-items:center;border:1.5px dashed var(--line);border-radius:12px;padding:13px;background:#FBFAF8}
.up .pv{width:82px;height:82px;border-radius:11px;background:#EFEAE3;flex:none;display:flex;align-items:center;justify-content:center;font-size:25px;overflow:hidden;border:1px solid var(--line)}
.up .pv img{width:100%;height:100%;object-fit:cover}
.up .uc{flex:1;min-width:0}
.up .uc p{font-size:12.5px;color:var(--soft);line-height:1.45;margin-bottom:8px}
.up.wide .pv{width:100%;height:120px;border-radius:11px}
.up.wide{flex-direction:column;align-items:stretch}

/* ---------- LISTAS ---------- */
.li{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;transition:.13s}
.li:hover{border-color:#d6cec2}
.li.off{opacity:.5}
.li .th{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#EFEAE3;flex:none;display:flex;align-items:center;justify-content:center;font-size:21px;border:1px solid var(--line)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx small{display:block;font-size:12px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .pr{font-weight:800;font-size:14.5px;white-space:nowrap}
.li .ax{display:flex;gap:5px;flex:none}
.ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;color:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
@media(max-width:420px){
  .li{padding:9px 10px;gap:9px}
  .li .ax{gap:3px}
  .ib{width:27px;height:27px;font-size:12px}
  .li .pr{font-size:13px}
}
.ib:hover{background:#F3EFE9;color:var(--ink)}
.ib.del:hover{background:#fdf0ee;color:var(--brand);border-color:#f6dcd8}
.grp{margin-bottom:22px}
.grp>h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--soft);margin:0 2px 9px;display:flex;align-items:center;gap:8px}
.grp>h3 .ct{background:#EFEAE3;color:var(--soft);border-radius:99px;padding:2px 8px;font-size:11px;letter-spacing:0}
.vazio{text-align:center;border:1.5px dashed var(--line);border-radius:12px;padding:26px 18px;color:var(--soft);font-size:13.5px;line-height:1.6;background:#FBFAF8}
.vazio .em{font-size:32px;margin-bottom:7px}
.vazio b{color:var(--ink)}

/* ---------- CHECKLIST ---------- */
.ck{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:#fff;width:100%;text-align:left;transition:.13s}
.ck:hover{border-color:#cdc5b9}
.ck .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.ck.done{background:var(--okbg);border-color:#BFE0C6}
.ck.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.ck .tt{flex:1;min-width:0}
.ck .tt b{display:block;font-size:14px;font-weight:700}
.ck .tt small{display:block;font-size:12px;color:var(--soft);margin-top:1px;line-height:1.4}
.ck.done .tt b{text-decoration:line-through;opacity:.7}
.ck .go{color:var(--soft);font-size:17px}
.prog{height:9px;background:#EFEAE3;border-radius:99px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ok));border-radius:99px;transition:width .4s}
.prog-t{font-size:12.5px;color:var(--soft);font-weight:600}

/* ---------- MODAL ---------- */
.ov{position:fixed;inset:0;background:rgba(30,20,14,.55);z-index:70;opacity:0;pointer-events:none;transition:.2s}
.ov.on{opacity:1;pointer-events:auto}
.md{position:fixed;z-index:80;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.2s;
  width:min(94vw,560px);max-height:90vh;display:flex;flex-direction:column}
.md.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
@media(max-width:600px){.md{width:100%;left:0;top:auto;bottom:0;transform:translateY(100%);border-radius:18px 18px 0 0;max-height:94vh}
 .md.on{transform:translateY(0)}}
.md-h{display:flex;align-items:center;justify-content:space-between;padding:17px 20px 13px;border-bottom:1px solid var(--line)}
.md-h h3{font-size:17.5px;font-weight:800}
.md-b{overflow-y:auto;padding:18px 20px}
.md-f{padding:14px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.md-f .btn{flex:1;padding:13px;font-size:15px;justify-content:center;text-align:center}
.x{font-size:25px;color:var(--soft);width:34px;height:34px;line-height:1}

/* ---------- WIZARD ---------- */
.wz{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column}
.wz.on{display:flex}
.wz-top{background:#fff;border-bottom:1px solid var(--line);padding:13px 18px}
.wz-top .st{display:flex;align-items:center;justify-content:space-between;max-width:620px;margin:0 auto 9px;font-size:12.5px;font-weight:700;color:var(--soft)}
.wz-bar{max-width:620px;margin:0 auto;height:7px;background:#EFEAE3;border-radius:99px;overflow:hidden}
.wz-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--brand));border-radius:99px;transition:width .35s}
.wz-body{flex:1;overflow-y:auto;padding:26px 18px 20px}
.wz-in{max-width:560px;margin:0 auto}
.wz-in .em{font-size:44px;margin-bottom:11px;line-height:1}
.wz-in h2{font-size:25px;font-weight:800;margin-bottom:7px;line-height:1.2}
.wz-in .lead{font-size:14.5px;color:var(--soft);line-height:1.6;margin-bottom:20px}
.wz-foot{background:#fff;border-top:1px solid var(--line);padding:13px 18px calc(15px + env(safe-area-inset-bottom))}
.wz-foot .in2{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.wz-foot .btn{padding:14px 22px;font-size:15px}
.wz-foot .btn-p{flex:1;text-align:center}
.wz-skip{font-size:12.5px;color:var(--soft);text-decoration:underline;background:none;padding:8px}

/* ---------- TOAST ---------- */
.tst{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(24px);z-index:99;background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.24s;box-shadow:0 10px 30px rgba(0,0,0,.32);max-width:90vw}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:860px){.tst{bottom:88px}}

/* ---------- TOUR (guia que destaca o elemento na tela) ---------- */
.tour-fab{position:fixed;right:18px;bottom:22px;z-index:65;background:var(--ink);color:#fff;border-radius:99px;
  padding:12px 18px 12px 15px;display:none;align-items:center;gap:9px;font-weight:700;font-size:13.5px;
  box-shadow:0 10px 28px rgba(0,0,0,.28);transition:.15s}
.tour-fab.show{display:flex}
.tour-fab:hover{background:#000}
.tour-fab .xx{background:rgba(255,255,255,.16);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:13px}
@media(max-width:860px){.tour-fab{bottom:78px}}
.tour-hole{position:fixed;z-index:120;border-radius:13px;box-shadow:0 0 0 9999px rgba(24,17,12,.62);
  border:2.5px solid var(--gold);display:none;pointer-events:none;transition:all .25s cubic-bezier(.3,.7,.3,1)}
.tour-bubble{position:fixed;z-index:121;background:#fff;border-radius:14px;box-shadow:0 16px 44px rgba(0,0,0,.32);
  padding:16px 18px;width:300px;max-width:calc(100vw - 28px);display:none;transition:all .25s cubic-bezier(.3,.7,.3,1)}
.tour-bubble .tp{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.4px}
.tour-bubble h4{font-size:15.5px;font-weight:800;margin:5px 0 6px}
.tour-bubble p{font-size:13px;color:var(--soft);line-height:1.5}
.tour-bubble .tf{display:flex;align-items:center;justify-content:space-between;margin-top:13px}
.tour-bubble .tf .esq{display:flex;gap:8px;align-items:center}
.tour-skip{font-size:12px;color:var(--soft);text-decoration:underline}
.tour-nav{background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:9px 15px;border-radius:9px}
.tour-back{background:none;color:var(--soft);font-size:13px;padding:9px 6px}

.linkbox{display:flex;gap:9px;align-items:center;background:#FBFAF8;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:10px}
.linkbox code{flex:1;font-size:12.5px;font-family:ui-monospace,monospace;color:var(--soft);word-break:break-all}
.steps{counter-reset:s;margin-top:6px}
.steps li{list-style:none;position:relative;padding:0 0 14px 38px;font-size:13.5px;line-height:1.6;color:var(--soft)}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.steps li b{color:var(--ink)}

<script src="nuvem.js"></script>
<script>
/* ==================================================================
   PAINEL DA LOJA — o dono configura tudo sozinho, sem mexer em código.
   Os dados ficam salvos no navegador e viram o arquivo dados.json,
   que é o que o site do cardápio lê.
================================================================== */

const CHAVE = "bb_loja_dados";
const CHAVE_ONB = "bb_onboarding";

const VAZIO = {
  loja:{nome:"",slogan:"",logo:"",capa:"",whatsapp:"",endereco:"",maps:"",sobreTitulo:"",sobre:""},
  cores:{principal:"#C0392B",principalEscuro:"#8E2A20",destaque:"#E8A33D",fundo:"#FBF3E7",cartao:"#FFFDF8",texto:"#2A211E"},
  horario:{dias:[0,1,2,3,4,5,6],abre:"18:00",fecha:"23:00"},
  entrega:{ativa:true,taxa:8,gratisAcima:70,retirada:true,gorjetas:[0,2,5]},
  pagamento:{pix:true,dinheiro:true,cartao:true},
  combo:{ativo:false,preco:12,label:"Combo (batata + refri)",chamada:"Adicione batata + refri por só"},
  mensagens:{},
  cupons:[], pontos:[], adicionais:[], categorias:[], produtos:[]
};

let DB = null;
let ONB = { feito:false, passo:0, vistos:{} };
let TELA = "inicio";
let sujo = false;

/* ---------- carregar / salvar ---------- */
async function carregar(){
  try{ const o=localStorage.getItem(CHAVE_ONB); if(o) ONB={...ONB,...JSON.parse(o)}; }catch(e){}
  // o servidor é a fonte oficial — assim o dono edita de qualquer aparelho
  try{
    const r = await NUVEM.carregarCardapio();
    if(r && r.dados && Object.keys(r.dados).length){ DB = normalizar(r.dados); return; }
  }catch(e){ console.warn("sem conexão, usando cópia local", e); }
  const local = localStorage.getItem(CHAVE);
  if(local){ try{ DB = normalizar(JSON.parse(local)); return; }catch(e){} }
  try{
    const r = await fetch("dados.json",{cache:"no-store"});
    if(r.ok){ DB = normalizar(await r.json()); return; }
  }catch(e){}
  DB = normalizar(JSON.parse(JSON.stringify(VAZIO)));
  ONB.feito = false;
}
function normalizar(d){
  const b = JSON.parse(JSON.stringify(VAZIO));
  const out = {...b, ...d};
  for(const k of ["loja","cores","horario","entrega","pagamento","combo","mensagens"]) out[k] = {...b[k], ...(d[k]||{})};
  for(const k of ["cupons","pontos","adicionais","categorias","produtos"]) out[k] = Array.isArray(d[k]) ? d[k] : [];
  return out;
}
/* Salva local na hora e publica sozinho no servidor logo em seguida.
   O dono não precisa baixar nem subir arquivo nenhum. */
let timerPublicar = null, publicando = false;
function salvar(){
  localStorage.setItem(CHAVE, JSON.stringify(DB));
  localStorage.setItem(CHAVE_ONB, JSON.stringify(ONB));
  pintarTopo();
  marcarEstado("pendente");
  clearTimeout(timerPublicar);
  timerPublicar = setTimeout(publicarAgora, 1200);
}
async function publicarAgora(){
  if(publicando) return;
  publicando = true; marcarEstado("salvando");
  try{
    await NUVEM.salvarCardapio(DB);
    ONB.publicou = true;
    localStorage.setItem(CHAVE_ONB, JSON.stringify(ONB));
    marcarEstado("ok");
  }catch(e){
    marcarEstado("erro");
  }finally{ publicando = false; }
}
function marcarEstado(e){
  const el = document.getElementById("estado"); if(!el) return;
  const map = {
    pendente:["⏳","Salvando…","var(--soft)"],
    salvando:["⏳","Publicando…","var(--soft)"],
    ok:["✅","Publicado","var(--ok)"],
    erro:["⚠️","Sem conexão — salvo no aparelho","var(--brand)"]
  };
  const [i,t,c] = map[e] || map.ok;
  el.innerHTML = `<span>${i}</span> ${t}`;
  el.style.color = c;
}
function set(cam, val){
  const p = cam.split("."); let o = DB;
  for(let i=0;i<p.length-1;i++) o = o[p[i]];
  o[p[p.length-1]] = val; salvar();
}
function pega(cam){ return cam.split(".").reduce((o,k)=>o?.[k], DB); }

/* ---------- utilidades ---------- */
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const brl = v => "R$ " + (Number(v)||0).toFixed(2).replace(".",",");
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isNaN(n)?0:n; };
function slug(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "item";
}
function idUnico(base, lista){
  let s = slug(base), i = 2;
  while(lista.some(x=>x.id===s || x.key===s)){ s = slug(base)+"-"+i; i++; }
  return s;
}
let tt; function toast(m){ const t=document.getElementById("tst"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2100); }
function verSite(){ window.open("index.html","_blank"); }
function pintarTopo(){
  document.getElementById("tNome").textContent = DB.loja.nome || "Minha Loja";
  const l = document.getElementById("tLogo");
  l.src = DB.loja.logo || "apple-touch-icon.png";
}

/* ---------- imagens: reduz e guarda dentro do arquivo ---------- */
function pegarImagem(input, maxLado, cb){
  const f = input.files && input.files[0];
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast("Escolha um arquivo de imagem"); return; }
  const r = new FileReader();
  r.onload = e => {
    const img = new Image();
    img.onload = () => {
      let {width:w, height:h} = img;
      const esc2 = Math.min(1, maxLado/Math.max(w,h));
      w = Math.round(w*esc2); h = Math.round(h*esc2);
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      cb(c.toDataURL("image/jpeg",0.78));
    };
    img.onerror = () => toast("Não consegui abrir essa imagem");
    img.src = e.target.result;
  };
  r.readAsDataURL(f);
}

/* ==================================================================
   PROGRESSO DA CONFIGURAÇÃO
================================================================== */
const TAREFAS = [
  {id:"loja",  t:"Dados da loja",       d:"Nome, WhatsApp e endereço",            tela:"config", sub:"geral",     ok:()=>!!(DB.loja.nome && DB.loja.whatsapp)},
  {id:"marca", t:"Logo e cores",        d:"Deixe com a cara da sua marca",        tela:"config", sub:"marca",     ok:()=>!!DB.loja.logo},
  {id:"hora",  t:"Horário de atendimento", d:"Quando a loja abre e fecha",        tela:"config", sub:"horarios",  ok:()=>DB.horario.dias.length>0},
  {id:"ent",   t:"Entrega e pagamento", d:"Taxa, frete grátis e formas de pagar", tela:"config", sub:"entrega",   ok:()=>DB.entrega.ativa||DB.entrega.retirada},
  {id:"cat",   t:"Criar categorias",    d:"Ex: Burgers, Bebidas, Sobremesas",     tela:"categorias", ok:()=>DB.categorias.length>0},
  {id:"prod",  t:"Cadastrar produtos",  d:"No mínimo 3 pra loja não ficar vazia", tela:"produtos",   ok:()=>DB.produtos.length>=3},
  {id:"pub",   t:"Divulgar o cardápio", d:"Pegue o link e o QR Code da sua loja", tela:"publicar",   ok:()=>!!ONB.publicou},
];
const feitas = () => TAREFAS.filter(t=>t.ok()).length;

/* ==================================================================
   MENU LATERAL
================================================================== */
const MENUS = [
  {id:"inicio",     ic:"🏠", t:"Início"},
  {id:"pedidos",    ic:"🔔", t:"Pedidos"},
  {id:"categorias", ic:"📂", t:"Categorias"},
  {id:"produtos",   ic:"🍔", t:"Produtos"},
  {id:"opcoes",     ic:"⚙️", t:"Opções e extras"},
  {id:"config",     ic:"🔧", t:"Configurações"},
  {id:"publicar",   ic:"🚀", t:"Divulgar"},
];
function pintarMenu(){
  document.getElementById("side").innerHTML = MENUS.map(m=>{
    const pend = TAREFAS.some(t=>t.tela===m.id && !t.ok());
    const nNovos = m.id==="pedidos" ? contarPed("novo") : 0;
    const badge = nNovos ? `<span class="pend" style="background:var(--brand)">${nNovos}</span>` : pend ? `<span class="pend">!</span>` : "";
    return `<button class="nav-i ${TELA===m.id?"on":""}" onclick="go('${m.id}')" style="position:relative">
      <span class="ic">${m.ic}</span><span>${m.t}</span>${badge}</button>`;
  }).join("");
}
function go(t, sub){
  TELA=t; if(t==="config" && sub) configSub=sub;
  pintarMenu(); pintar(); window.scrollTo({top:0,behavior:"smooth"});
  fecharTour();
  const fab = document.getElementById("tourFab");
  fab.classList.toggle("show", !!TOURS[t]);
  if(TOURS[t] && !(ONB.tourVisto||{})[t]) setTimeout(()=>iniciarTour(true), 450);
}

/* ==================================================================
   TELAS
================================================================== */
let configSub = "geral";
const CONFIG_SUBS = [
  {id:"geral",     t:"Geral",      ic:"🏪", d:"Nome, WhatsApp, endereço"},
  {id:"marca",     t:"Marca",      ic:"🎨", d:"Logo, cores, capa"},
  {id:"horarios",  t:"Horários",   ic:"🕐", d:"Funcionamento por dia"},
  {id:"entrega",   t:"Entrega",    ic:"🛵", d:"Modo, taxa de entrega"},
  {id:"pagamento", t:"Pagamento",  ic:"💳", d:"Formas aceitas"},
];
function telaConfig(){
  const render = {geral:telaLoja, marca:telaMarca, horarios:telaHorario, entrega:telaEntrega, pagamento:telaPagamento}[configSub] || telaLoja;
  return `
  <div class="card" style="padding:0;overflow:hidden">
    <div style="padding:20px 20px 16px">
      <h2 style="margin-bottom:3px">Configurações</h2>
      <div class="sub" style="margin-bottom:0">Personalize sua loja e preferências operacionais.</div>
    </div>
    <div class="subtabs">
      ${CONFIG_SUBS.map(s=>`<button class="subtab ${configSub===s.id?"on":""}" onclick="configSub='${s.id}';pintar()">
        <span class="ic">${s.ic}</span><span class="tt"><b>${s.t}</b><small>${s.d}</small></span></button>`).join("")}
    </div>
  </div>
  ${render()}`;
}
function pintar(){
  const m = document.getElementById("main");
  m.innerHTML = ({
    inicio:telaInicio, config:telaConfig, categorias:telaCategorias,
    produtos:telaProdutos, opcoes:telaOpcoes, publicar:telaPublicar, pedidos:telaPedidos
  })[TELA]();
  pintarTopo();
  if(TELA==="pedidos") pintarPedidosLista();
}

/* ---------- INÍCIO ---------- */
function telaInicio(){
  const f = feitas(), tot = TAREFAS.length, pct = Math.round(f/tot*100);
  const pronto = f===tot;
  return `
  <div class="card">
    <h2>${pronto?"Sua loja está pronta 🎉":"Vamos deixar sua loja pronta"}</h2>
    <div class="sub">${pronto
      ? "Tudo configurado. Sempre que mudar preço ou produto, é só editar aqui e publicar de novo."
      : "Siga a lista abaixo na ordem. Cada passo leva menos de 2 minutos e o painel te explica o que fazer."}</div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="prog-t">${f} de ${tot} etapas concluídas · ${pct}%</div>
    <div style="margin-top:18px">
      ${TAREFAS.map(t=>`
        <button class="ck ${t.ok()?"done":""}" onclick="go('${t.tela}','${t.sub||""}')">
          <span class="bx">✓</span>
          <span class="tt"><b>${t.t}</b><small>${t.d}</small></span>
          <span class="go">›</span>
        </button>`).join("")}
    </div>
  </div>

  <div class="card">
    <h2>Resumo do cardápio</h2>
    <div class="sub">O que já está cadastrado hoje.</div>
    <div class="r3">
      ${[["Categorias",DB.categorias.length,"📂"],["Produtos",DB.produtos.filter(p=>p.ativo!==false).length,"🍔"],["Adicionais",DB.adicionais.filter(a=>a.ativo!==false).length,"➕"]]
        .map(([t,v,e])=>`<div style="border:1px solid var(--line);border-radius:12px;padding:15px;text-align:center;background:#FBFAF8">

function moverCat(i,d){ const a=DB.categorias, j=i+d; if(j<0||j>=a.length)return; [a[i],a[j]]=[a[j],a[i]]; salvar(); pintar(); }
function apagarCat(i){
  const c = DB.categorias[i];
  const n = DB.produtos.filter(p=>p.cat===c.key).length;
  if(!confirm(`Excluir a categoria "${c.nome}"?` + (n?`\n\nOs ${n} produto(s) dentro dela também serão excluídos.`:""))) return;
  DB.produtos = DB.produtos.filter(p=>p.cat!==c.key);
  DB.categorias.splice(i,1); salvar(); pintar(); toast("Categoria excluída");
}
function editarCat(i){
  const nova = i<0;
  const c = nova ? {key:"",nome:"",sub:"",emoji:"📂",montavel:false} : {...DB.categorias[i]};
  abrirModal(nova?"Nova categoria":"Editar categoria", `
    ${nova?`<div class="guia" style="margin-bottom:16px"><span class="gi">✨</span><div>
      Dê um nome curto e direto. É esse nome que vira o botãozinho lá em cima do cardápio.</div></div>`:""}
    <div class="f"><label>Nome da categoria</label>
      <input class="in" id="cN" placeholder="Ex: Burgers" value="${esc(c.nome)}"></div>
    <div class="f"><label>Frase curta (opcional)</label>
      <input class="in" id="cS" placeholder="Ex: na chapa · vira combo se quiser" value="${esc(c.sub)}">
      <div class="hint">Aparece pequenininha do lado do nome.</div></div>
    <div class="f"><label>Emojizinho</label>
      <input class="in" id="cE" maxlength="4" style="width:88px;text-align:center;font-size:22px" value="${esc(c.emoji||"📂")}">
      <div class="hint">Usado nos produtos que não têm foto.</div></div>
    <button class="sw ${c.montavel?"on":""}" id="cM" onclick="this.classList.toggle('on')">
      <span class="kn"></span>
      <span class="tt"><b>O cliente monta na hora</b>
      <small>Liga ponto da carne, adicionais e combo pros produtos dessa categoria. Use em lanches; deixe desligado em bebidas.</small></span>
    </button>
  `, () => {
    const nome = document.getElementById("cN").value.trim();
    if(!nome){ toast("Dê um nome pra categoria"); return false; }
    const dados = { nome, sub:document.getElementById("cS").value.trim(),
      emoji:document.getElementById("cE").value.trim()||"📂",
      montavel:document.getElementById("cM").classList.contains("on") };
    if(nova){
      DB.categorias.push({ key:idUnico(nome,DB.categorias), ...dados });
      toast("Categoria criada — agora cadastre os produtos dela");
    } else {
      DB.categorias[i] = { ...DB.categorias[i], ...dados };
      toast("Categoria salva");
    }
    salvar(); pintar();
  });
}

        return `<div class="li ${p.ativo===false?"off":""}">
          ${p.img?`<img class="th" src="${esc(p.img)}" alt="">`:`<div class="th">${c.emoji||"🍔"}</div>`}
          <div class="tx"><b>${esc(p.n)}${p.ativo===false?" · pausado":""}</b><small>${esc(p.d)||"sem descrição"}</small></div>
          <div class="pr">${brl(p.p)}</div>
          <div class="ax">
            <button class="ib" onclick="moverProd(${gi},-1)" ${idx===0?"disabled style=opacity:.3":""}>↑</button>

            <button class="ib" ${ci===0&&idx===0?'id="tourPausar"':""} onclick="togProd(${gi})" title="${p.ativo===false?"Ativar":"Pausar"}">${p.ativo===false?"▶":"⏸"}</button>
            <button class="ib" onclick="editarProd(${gi})">✏️</button>
            <button class="ib del" onclick="apagarProd(${gi})">🗑</button>

      }).join("")
      : `<div class="vazio" style="padding:20px"><b>Nenhum produto em ${esc(c.nome)}.</b><br>Cadastre o primeiro pra essa categoria aparecer no site.</div>`}
      <button class="btn btn-g" ${ci===0?'id="tourNovoProduto"':""} style="width:100%;margin-top:11px" onclick="editarProd(-1,'${c.key}')">+ Adicionar em ${esc(c.nome)}</button>
    </div>`;
  }).join("")}`;
}
function togProd(i){ const p=DB.produtos[i]; p.ativo = p.ativo===false; salvar(); pintar(); toast(p.ativo===false?"Produto pausado":"Produto ativo de novo"); }
function apagarProd(i){ if(!confirm(`Excluir "${DB.produtos[i].n}"?`))return; DB.produtos.splice(i,1); salvar(); pintar(); toast("Produto excluído"); }
function moverProd(i,d){
  const p = DB.produtos[i];
  const irmaos = DB.produtos.filter(x=>x.cat===p.cat);
  const pos = irmaos.indexOf(p), alvo = irmaos[pos+d];
  if(!alvo) return;
  const j = DB.produtos.indexOf(alvo);
  [DB.produtos[i],DB.produtos[j]] = [DB.produtos[j],DB.produtos[i]];
  salvar(); pintar();
}
let imgTemp = null;
function editarProd(i, catPadrao){
  const nova = i<0;
  const p = nova ? {n:"",d:"",p:"",img:"",cat:catPadrao||DB.categorias[0].key,carne:false,ativo:true} : {...DB.produtos[i]};
  imgTemp = p.img || "";
  const cat = DB.categorias.find(c=>c.key===p.cat);
  abrirModal(nova?"Novo produto":"Editar produto", `
    <div class="f"><label>Foto do produto</label>
      <div class="up">
        <div class="pv" id="pPv">${imgTemp?`<img src="${esc(imgTemp)}">`:"📷"}</div>
        <div class="uc">
          <p>Foto boa aumenta muito a venda. Tire de cima, com luz natural.</p>
          <p style="font-size:11.5px;color:var(--soft);margin-top:2px">Tamanho ideal: <b>800×800px</b>, quadrada · PNG ou JPG</p>
          <label class="btn btn-g btn-sm" style="display:inline-block;margin-top:6px">Escolher foto
            <input type="file" accept="image/*" hidden onchange="pegarImagem(this,700,v=>{imgTemp=v;document.getElementById('pPv').innerHTML='<img src=\\''+v+'\\'>'})">
          </label>
          <button class="btn btn-dg btn-sm" style="margin-left:6px" onclick="imgTemp='';document.getElementById('pPv').innerHTML='📷'">Sem foto</button>
        </div>
      </div>
    </div>
    <div class="f"><label>Nome</label>
      <input class="in" id="pN" placeholder="Ex: Cheddar Bacon" value="${esc(p.n)}"></div>
    <div class="f"><label>Descrição</label>
      <textarea class="in" id="pD" style="min-height:76px" placeholder="Ex: blend 160g, cheddar derretido, bacon crocante e cebola no pão brioche">${esc(p.d)}</textarea>
      <div class="hint">Liste os ingredientes. É o que faz o cliente escolher.</div></div>
    <div class="r2">
      <div class="f"><label>Preço (R$)</label>
        <input class="in" id="pP" inputmode="decimal" placeholder="0,00" value="${p.p===""?"":String(p.p).replace(".",",")}"></div>
      <div class="f"><label>Categoria</label>
        <select class="in" id="pC">${DB.categorias.map(c=>`<option value="${c.key}" ${c.key===p.cat?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></div>
    </div>
    ${cat && cat.montavel ? `
    <button class="sw ${p.carne?"on":""}" id="pCar" onclick="this.classList.toggle('on')">
      <span class="kn"></span>
      <span class="tt"><b>Perguntar o ponto da carne</b><small>Ligue só em burger de carne bovina. Em frango ou veggie, deixe desligado.</small></span>
    </button>` : ""}
    <button class="sw ${p.ativo!==false?"on":""}" id="pAt" onclick="this.classList.toggle('on')">
      <span class="kn"></span>
      <span class="tt"><b>Disponível pra venda</b><small>Desligue quando acabar o item. Ele some do site sem perder o cadastro.</small></span>
    </button>
  `, () => {
    const n = document.getElementById("pN").value.trim();
    if(!n){ toast("Dê um nome pro produto"); return false; }
    const preco = num(document.getElementById("pP").value);
    if(preco<=0){ toast("Coloque o preço do produto"); return false; }
    const dados = {
      n, d:document.getElementById("pD").value.trim(), p:preco,
      cat:document.getElementById("pC").value, img:imgTemp||"",
      carne: !!document.getElementById("pCar")?.classList.contains("on"),
      ativo: document.getElementById("pAt").classList.contains("on")
    };
    if(nova){ DB.produtos.push({ id:idUnico(n,DB.produtos), ...dados }); toast("Produto cadastrado"); }
    else { DB.produtos[i] = { ...DB.produtos[i], ...dados }; toast("Produto salvo"); }
    salvar(); pintar();
  });
}

let tourPassos = [], tourIdx = 0, tourReposicionar = null;
function iniciarTour(auto){
  const base = TOURS[TELA]; if(!base) return;
  tourPassos = base.filter(p=>document.querySelector(p.sel));
  if(!tourPassos.length) return;
  tourIdx = 0;

function mostrarPassoTour(){
  if(tourIdx>=tourPassos.length){ fecharTour(true); return; }
  const p = tourPassos[tourIdx];
  const el = document.querySelector(p.sel);
  if(!el){ tourIdx++; mostrarPassoTour(); return; }
  el.scrollIntoView({block:"center", behavior:"smooth"});
  clearTimeout(tourReposicionar);

}
function desenharTour(el,p){
  const r = el.getBoundingClientRect();
  const hole = document.getElementById("tourHole");
  hole.style.left=(r.left-6)+"px"; hole.style.top=(r.top-6)+"px";
  hole.style.width=(r.width+12)+"px"; hole.style.height=(r.height+12)+"px";
  hole.style.display="block";

  const bub = document.getElementById("tourBubble");
  const ult = tourIdx===tourPassos.length-1;
  bub.innerHTML = `
    <div class="tp">Passo ${tourIdx+1} de ${tourPassos.length}</div>
    <h4>${p.tit}</h4><p>${p.tx}</p>
    <div class="tf">
      <div class="esq">${tourIdx>0?`<button class="tour-back" onclick="tourIdx--;mostrarPassoTour()">Voltar</button>`:""}
        <button class="tour-skip" onclick="fecharTour(true)">Pular tour</button></div>
      <button class="tour-nav" onclick="tourIdx++;mostrarPassoTour()">${ult?"Concluir":"Próximo →"}</button>
    </div>`;
  bub.style.display = "block";
  const abaixo = window.innerHeight - r.bottom > 190;
  bub.style.top = (abaixo ? r.bottom+14 : Math.max(14, r.top-14-bub.offsetHeight)) + "px";
  bub.style.left = Math.min(window.innerWidth-bub.offsetWidth-14, Math.max(14, r.left)) + "px";
}
function fecharTour(concluiu){
  document.getElementById("tourHole").style.display="none";
  document.getElementById("tourBubble").style.display="none";
  if(concluiu && TOURS[TELA]){

    ONB.tourVisto[TELA] = true;
    localStorage.setItem(CHAVE_ONB, JSON.stringify(ONB));

}

function pedFaz(min){
  if(min<1) return "agora";
  if(min<60) return `há ${Math.round(min)} min`;
  const h=Math.floor(min/60); return `há ${h}h${String(Math.round(min%60)).padStart(2,"0")}`;
}

/* ---------- SOM ---------- */
function ligarSom(){
  try{
    pedCtx = pedCtx || new (window.AudioContext||window.webkitAudioContext)();
    pedCtx.resume();
    pedAudioOk = true;
    pedTocarAlerta(1);
    toast("Som ativado");
  }catch(e){ toast("Este navegador não deixou ativar o som"); }
  pintarSomBtn();
}
/* Botão fixo do sino no topo — sempre visível, um clique resolve:
   1º clique na aba (som nunca foi liberado ainda): libera o som e liga.
   Cliques seguintes: só alterna ligado/desligado, sem pedir de novo. */
function alternarSom(){
  if(!pedAudioOk){
    somLigado = true;
    localStorage.setItem("bb_som","1");
    ligarSom();
    return;
  }
  somLigado = !somLigado;
  localStorage.setItem("bb_som", somLigado?"1":"0");
  if(somLigado){ pedTocarAlerta(1); toast("Som ligado"); }
  else { pedPararAlarme(); toast("Som desligado"); }
  pintarSomBtn();
}
function pintarSomBtn(){
  const b = document.getElementById("btnSom"); if(!b) return;
  const n = contarPed("novo");
  const precisaAtivar = somLigado && !pedAudioOk;
  b.classList.toggle("mudo", !somLigado);
  b.title = precisaAtivar ? "Toque para ativar o aviso sonoro" : somLigado ? "Som ativado — toque pra desligar" : "Som desligado — toque pra ligar";
  b.innerHTML = (somLigado?"🔔":"🔕") + (n?`<span class="bad">${n}</span>`:"") + (precisaAtivar?`<span class="dot"></span>`:"");
}

/* Uma "badalada" com corpo — duas vozes afinadas + brilho, cauda longa. */
function pedBadalada(t0, base){
  const g = pedCtx.createGain();
  g.connect(pedCtx.destination);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.55, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.15);
  [[base,0.9,"sine"],[base*2,0.42,"sine"],[base*2.997,0.16,"triangle"]].forEach(([f,v,tipo])=>{
    const o = pedCtx.createOscillator(), og = pedCtx.createGain();
    o.type = tipo; o.frequency.setValueAtTime(f, t0);
    og.gain.setValueAtTime(v, t0);
    og.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.1);
    o.connect(og); og.connect(g);
    o.start(t0); o.stop(t0 + 1.2);
  });
}
function pedCicloAlerta(t0){
  pedBadalada(t0,        784);
  pedBadalada(t0 + 0.34, 988);
  pedBadalada(t0 + 0.68, 1319);
  pedBadalada(t0 + 1.5,  988);
  pedBadalada(t0 + 1.84, 1319);
}
function pedTocarAlerta(ciclos){
  if(!pedCtx || !somLigado) return;
  const n = ciclos || 2;
  const t = pedCtx.currentTime + 0.05;
  for(let i=0;i<n;i++) pedCicloAlerta(t + i*2.6);
  if(navigator.vibrate) navigator.vibrate([400,180,400,180,600]);
}
/* Toca só quando o pedido chega — 2 rodadas e pronto. Não repete
   quando muda de status; o título piscando avisa em silêncio
   enquanto o pedido novo não for aceito. */
function pedIniciarAlarme(){
  if(pedAlarmeAtivo) return;
  pedAlarmeAtivo = true;
  pedTocarAlerta(2);
  pedPiscarTitulo();
  pedNotificar();
}
function pedPararAlarme(){
  pedAlarmeAtivo = false;
  clearInterval(pedTimerTitulo); pedTimerTitulo = null;
  document.title = pedTituloOriginal;
}
let pedTimerTitulo = null;
function pedPiscarTitulo(){
  if(pedTimerTitulo) return;
  let a = false;
  pedTimerTitulo = setInterval(()=>{
    const n = contarPed("novo");
    if(!n){ document.title = pedTituloOriginal; clearInterval(pedTimerTitulo); pedTimerTitulo=null; return; }
    document.title = (a = !a) ? `🔔 (${n}) PEDIDO NOVO!` : pedTituloOriginal;
  }, 900);
}
function pedNotificar(){
  try{
    if(!("Notification" in window)) return;
    if(Notification.permission === "granted"){
      new Notification("Pedido novo!", { body:"Entrou um pedido no painel.", icon:"icon-192.png", tag:"pedido" });
    } else if(Notification.permission !== "denied"){
      Notification.requestPermission();
    }
  }catch(e){}
}

/* ---------- DADOS ---------- */
async function carregarPedidos(primeira){
  try{
    const antes = new Set(PEDIDOS.map(p=>p.id));
    PEDIDOS = await NUVEM.listarPedidos() || [];
    if(!primeira){
      const novos = PEDIDOS.filter(p => p.status==="novo" && !antes.has(p.id));
      if(novos.length) pedIniciarAlarme();
    } else if(contarPed("novo") > 0){
      pedIniciarAlarme();
    }
    pintarMenu();
    pintarSomBtn();
    if(TELA==="pedidos") pintarPedidosLista();
  }catch(e){ /* silencioso: tenta de novo no próximo ciclo */ }
}
function daAbaPed(p){ return (p.status==="entregue"||p.status==="recusado") ? "fim" : p.status; }
function contarPed(id){ return PEDIDOS.filter(p=>daAbaPed(p)===id).length; }

/* ---------- AÇÕES ---------- */
async function pedAvancar(id){
  const p = PEDIDOS.find(x=>x.id===id); if(!p) return;
  const novo = PED_PROXIMO[p.status]; if(!novo) return;
  p.status = novo; pintarPedidosLista(); pintarMenu(); pintarSomBtn();
  if(novo!=="novo"){ pedVistos.add(id); localStorage.setItem("bb_vistos", JSON.stringify([...pedVistos])); }
  if(contarPed("novo")===0) pedPararAlarme();
  try{
    await NUVEM.mudarStatus(id, novo);
    toast(novo==="preparo"?"Pedido aceito":novo==="pronto"?"Pedido pronto":"Pedido entregue");
    if(msgAtual(novo)) pedPerguntarZap(p, novo);
  }catch(e){ toast("Não consegui salvar. Confira a internet."); carregarPedidos(false); }
}
async function pedRecusar(id){
  if(!confirm("Recusar este pedido?")) return;
  const p = PEDIDOS.find(x=>x.id===id); if(!p) return;
  p.status = "recusado"; pintarPedidosLista(); pintarMenu(); pintarSomBtn();
  if(contarPed("novo")===0) pedPararAlarme();
  try{ await NUVEM.mudarStatus(id,"recusado"); toast("Pedido recusado"); if(msgAtual("recusado")) pedPerguntarZap(p,"recusado"); }
  catch(e){ toast("Não consegui salvar."); carregarPedidos(false); }
}
function pedAbrir(id){ pedAbertos[id] = !pedAbertos[id]; pintarPedidosLista(); }

function pedMontarMsg(p, status){
  const txt = msgAtual(status) || "";
  const entrega = p.tipo==="entrega" ? "Já vai sair para entrega. 🛵" : "Pode vir buscar no balcão. 🏠";
  return txt.replace(/{nome}/g, (p.cliente||"").split(" ")[0])
            .replace(/{codigo}/g, "#"+p.codigo)
            .replace(/{total}/g, brl(p.total))
            .replace(/{entrega}/g, entrega);
}
function pedZap(id, status){
  const p = PEDIDOS.find(x=>x.id===id); if(!p) return;
  const fone = String(p.telefone||"").replace(/\D/g,"");
  const num = fone.length<=11 ? "55"+fone : fone;
  const msg = status ? pedMontarMsg(p, status) : "";
  window.open(`https://wa.me/${num}` + (msg?`?text=${encodeURIComponent(msg)}`:""), "_blank");
}
/* O WhatsApp não deixa nenhum site mandar mensagem sozinho — isso aqui
   só ABRE a conversa com o texto pronto. Falta um clique de verdade
   dentro do WhatsApp pra sair. É assim em qualquer site, não só o nosso. */
function pedPerguntarZap(p, status){
  const t = document.getElementById("tst");
  t.innerHTML = `Avisar ${esc((p.cliente||"").split(" ")[0])} no WhatsApp?
    <button style="margin-left:10px;background:var(--pd-zap);color:#fff;font-weight:800;border-radius:9px;padding:7px 13px"
      onclick="pedZap('${p.id}','${status}');document.getElementById('tst').classList.remove('on')">Abrir WhatsApp</button>`;
  t.classList.add("on");
  clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("on"), 8000);
}

function telaPedidos(){
  return `

function pintarPedidosLista(){
  const abasEl = document.getElementById("pedAbasEl"); if(!abasEl) return;
  abasEl.innerHTML = PED_ABAS.map(a=>{
    const n = contarPed(a.id);
    const alerta = a.id==="novo" && n>0;
    return `<button class="aba ${pedAba===a.id?"on":""} ${alerta?"tem-novo":""}" onclick="pedAba='${a.id}';pintarPedidosLista()">
      ${a.t}${n?`<span class="n">${n}</span>`:""}</button>`;
  }).join("");

  const q = pedBusca.trim().toLowerCase();
  let lista = PEDIDOS.filter(p=>daAbaPed(p)===pedAba);
  if(q) lista = lista.filter(p =>
    (p.cliente||"").toLowerCase().includes(q) ||
    (p.codigo||"").toLowerCase().includes(q) ||
    (p.telefone||"").includes(q) ||
    (p.itens||[]).some(i=>(i.nome||"").toLowerCase().includes(q)));

  const el = document.getElementById("pedListaEl");
  if(!lista.length){
    const vaz = {
      novo:["🔔","Nenhum pedido novo","Quando entrar pedido, ele aparece aqui e toca o alerta."],
      preparo:["👨‍🍳","Nada em preparo","Os pedidos aceitos aparecem aqui."],
      pronto:["✅","Nenhum pedido pronto","Quando marcar como pronto, cai nesta aba."],
      fim:["📦","Nenhum pedido finalizado hoje","Entregues e recusados ficam aqui."]
    }[pedAba];
    el.innerHTML = `<div class="pd-vazio"><div class="em">${vaz[0]}</div><b>${vaz[1]}</b>${vaz[2]}</div>`;
    return;
  }
  el.innerHTML = lista.map(pedCard).join("");
}

            <div class="pr">${brl(p.p)}</div>
            <div class="ax"><button class="ib del" onclick="DB.produtos.splice(${DB.produtos.indexOf(p)},1);salvar();wzPintar()">🗑</button></div>
          </div>`).join("")}
          <button class="btn btn-g btn-sm" style="width:100%;margin-top:5px" onclick="wzProd('${c.key}')">+ Adicionar em ${esc(c.nome)}</button>
        </div>`;
      }).join("")}
      <div class="guia"><span class="gi">📸</span><div>
        <b>Dica que vale dinheiro:</b> produto com foto vende quase o dobro.
        Tire a foto de cima, perto da janela, sem flash.</div></div>`,
    ok:()=>DB.produtos.length ? true : "Cadastre pelo menos um produto"
  },
  {
    t:"Pronto", em:"🎉",
    tit:"Sua loja está no ar",
    lead:"É isso. Seu cardápio já funciona e os pedidos vão cair no seu WhatsApp.",
    corpo:()=>`
      <div class="guia" style="background:var(--okbg);border-color:var(--okline);color:var(--okink)"><span class="gi">✅</span><div>
        <b>${esc(DB.loja.nome)}</b> · ${DB.categorias.length} categoria(s) · ${DB.produtos.length} produto(s)</div></div>
      <div class="f"><label>E agora?</label>
        <ol class="steps">
          <li>Toque em <b>Ver meu site</b> e confira como ficou.</li>
          <li>Vá em <b>Publicar</b> e baixe o arquivo do cardápio pra colocar no ar.</li>
          <li>Cole o link do site na bio do Instagram e no status do WhatsApp.</li>
        </ol></div>
      <div class="guia"><span class="gi">💡</span><div>
        Sempre que mudar um preço ou acabar um item, é só entrar aqui e editar. Leva 10 segundos.</div></div>`,
    ok:()=>true
  }
];
function wzAddCat(){
  const el=document.getElementById("wCat"), v=el.value.trim();
  if(!v) return;
  DB.categorias.push({key:idUnico(v,DB.categorias), nome:v, sub:"", emoji:"📂", montavel:false});
  salvar(); wzPintar();
}
function wzProd(catKey){
  imgTemp = "";
  abrirModal("Novo produto", `
    <div class="f"><label>Foto (opcional agora)</label>
      <div class="up"><div class="pv" id="pPv">📷</div>
        <div class="uc"><p>Pode adicionar depois, mas com foto vende bem mais.</p>
          <p style="font-size:11.5px;color:var(--soft);margin-top:2px">Tamanho ideal: <b>800×800px</b>, quadrada</p>
          <label class="btn btn-g btn-sm" style="display:inline-block;margin-top:6px">Escolher foto
            <input type="file" accept="image/*" hidden onchange="pegarImagem(this,700,v=>{imgTemp=v;document.getElementById('pPv').innerHTML='<img src=\\''+v+'\\'>'})">
          </label></div></div></div>
    <div class="f"><label>Nome</label><input class="in" id="pN" placeholder="Ex: Cheddar Bacon"></div>
    <div class="f"><label>Descrição</label>
      <textarea class="in" id="pD" style="min-height:70px" placeholder="Ingredientes do produto"></textarea></div>
    <div class="f"><label>Preço (R$)</label><input class="in" id="pP" inputmode="decimal" placeholder="0,00"></div>
  `, () => {
    const n=document.getElementById("pN").value.trim(), p=num(document.getElementById("pP").value);
    if(!n){ toast("Dê um nome"); return false; }
    if(p<=0){ toast("Coloque o preço"); return false; }
    const cat = DB.categorias.find(c=>c.key===catKey);
    DB.produtos.push({ id:idUnico(n,DB.produtos), cat:catKey, n, d:document.getElementById("pD").value.trim(),
      p, img:imgTemp||"", carne: !!(cat&&cat.montavel), ativo:true });
    salvar(); wzPintar(); toast("Produto cadastrado");
  });
}
function abrirWizard(p){
  wzP = p||0; ONB.feito = false;
  document.getElementById("wz").classList.add("on");
  document.body.style.overflow = "hidden";
  wzPintar();
}
function fecharWizard(concluiu){
  ONB.feito = true; ONB.passo = wzP; salvar();
  document.getElementById("wz").classList.remove("on");
  document.body.style.overflow = "";
  go(concluiu ? "inicio" : TELA);
  if(concluiu) toast("Configuração concluída 🎉");
}
function wzPintar(){
  const p = PASSOS[wzP];
  document.getElementById("wzSt").textContent = `Passo ${wzP+1} de ${PASSOS.length} · ${p.t}`;
  document.getElementById("wzPc").textContent = Math.round((wzP)/(PASSOS.length-1)*100)+"%";
  document.getElementById("wzBar").style.width = ((wzP)/(PASSOS.length-1)*100)+"%";
  document.getElementById("wzB").innerHTML =
    `<div class="em">${p.em}</div><h2>${p.tit}</h2><div class="lead">${p.lead}</div>${p.corpo()}`;
  const ult = wzP===PASSOS.length-1;
  document.getElementById("wzF").innerHTML = `
    ${wzP>0?`<button class="btn btn-g" onclick="wzVoltar()">Voltar</button>`:""}
    <button class="btn btn-p" onclick="${ult?"fecharWizard(true)":"wzAvancar()"}">${ult?"Ir para o painel":"Continuar"}</button>
    ${!ult?`<button class="wz-skip" onclick="fecharWizard(false)">pular</button>`:""}`;
  document.querySelector(".wz-body").scrollTop = 0;
}
function wzAvancar(){
  const v = PASSOS[wzP].ok();
  if(v!==true){ toast(v); return; }
  wzP++; ONB.passo = wzP; salvar(); wzPintar();
}
function wzVoltar(){ if(wzP>0){ wzP--; wzPintar(); } }

/* ==================================================================
   INICIAR
================================================================== */
(async function(){
  await carregar();
  pintarMenu(); pintar();
  iniciarPedidos();
  const semNada = !DB.loja.nome && !DB.produtos.length;
  if(!ONB.feito && semNada) abrirWizard(ONB.passo||0);
})();
</script>
</body>
</html>
