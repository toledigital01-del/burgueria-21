<style>
:root{
  --bg:#FBF3E7; --card:#FFFDF8; --card2:#F5EAD9; --ink:#2A211E; --ink-soft:#7B6A5C;
  --line:#EBDFC9; --mostarda:#E8A33D; --mostarda-d:#c98a2b; --verm:#C0392B; --verm-d:#8E2A20;
  --alface:#4E8D3E; --green:#25D366; --shadow:0 8px 26px rgba(80,25,15,.12); --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(1100px 520px at 50% -10%,#fdf7ec,transparent 72%);
  -webkit-font-smoothing:antialiased;padding-bottom:96px}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
h1,h2,.disp{font-family:'Anton',Impact,sans-serif;font-weight:400;letter-spacing:.5px}

/* HERO */
.hero{position:relative;color:#fff;overflow:hidden;border-bottom:3px solid var(--verm)}
.hero-bg{position:absolute;inset:0;background:#3a1712}
.hero-bg img{width:100%;height:100%;object-fit:cover;opacity:.45}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(60,20,15,.55),rgba(90,25,18,.92))}
.hero-in{position:relative;max-width:960px;margin:0 auto;padding:20px 16px 22px}
.brand{display:flex;align-items:center;gap:13px}
.brand .logo{width:62px;height:62px;border-radius:14px;border:2px solid rgba(255,255,255,.3);box-shadow:var(--shadow)}
.brand h1{font-size:40px;line-height:.9;text-transform:uppercase}
.brand h1 b{color:var(--mostarda);font-weight:400}
.brand .tg{font-size:12.5px;color:var(--mostarda);font-weight:600;margin-top:5px;font-family:'Inter';text-transform:uppercase;letter-spacing:1px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:500}
.chip.status-open{background:rgba(78,141,62,.32);border-color:rgba(120,220,140,.45)}
.chip.status-closed{background:rgba(0,0,0,.35)}
.chip a{color:#fff;text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%}
.dot.on{background:#67e08a;box-shadow:0 0 0 0 rgba(103,224,138,.6);animation:pulse 1.8s infinite}
.dot.off{background:var(--mostarda)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(103,224,138,0)}100%{box-shadow:0 0 0 0 rgba(103,224,138,0)}}
.repeat{margin-top:14px;display:none;width:100%;background:#fff;color:var(--verm-d);font-weight:700;
  padding:12px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}
.repeat b{color:var(--ink)}

.closed-banner{background:var(--mostarda);color:#3a2408;font-size:13px;font-weight:600;text-align:center;padding:9px 14px;display:none}

/* NAV */
.nav{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(80,25,15,.05)}
.nav-in{max-width:960px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:11px 14px;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;font-size:13px;font-weight:600;color:var(--ink-soft);padding:7px 14px;border-radius:999px;
  background:var(--bg);border:1px solid var(--line);transition:.15s;text-decoration:none}
.nav a.active{background:var(--verm);color:#fff;border-color:var(--verm)}

main{max-width:960px;margin:0 auto;padding:6px 14px 40px}
.sec{padding-top:22px;scroll-margin-top:62px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:6px 2px 14px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.sec-h h2{font-size:26px;color:var(--verm-d);text-transform:uppercase}
.sec-h .sub{font-size:12.5px;color:var(--ink-soft);font-style:italic}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}

.card{display:flex;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.card .thumb{width:104px;height:104px;flex:none;border-radius:12px;object-fit:cover;background:var(--card2);border:1px solid var(--line)}
.card .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.card h3{font-family:'Inter';font-size:15.5px;font-weight:700;line-height:1.2}
.card .desc{font-size:12.5px;color:var(--ink-soft);line-height:1.4;margin-top:4px;flex:1}
.card .bot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px}
.price{font-family:'Anton';font-size:20px;letter-spacing:.5px}
.price small{font-family:'Inter';font-weight:500;font-size:11px;color:var(--ink-soft);letter-spacing:0}
.add{background:var(--verm);color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:10px;flex:none;white-space:nowrap;transition:.15s}
.add:hover{background:var(--verm-d)}.add:active{transform:scale(.95)}
.qtc{display:inline-flex;align-items:center;background:var(--verm);border-radius:10px;overflow:hidden}
.qtc button{color:#fff;font-size:18px;font-weight:700;width:32px;height:34px}
.qtc span{color:#fff;font-weight:700;font-size:14px;min-width:22px;text-align:center}
.simple .card .thumb{display:none}

/* FAB */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:60;width:min(92%,540px);
  background:var(--verm);color:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 10px 30px rgba(142,42,32,.42);transition:.2s;font-weight:700}
.fab:active{transform:translateX(-50%) scale(.98)}
.fab.hide{transform:translateX(-50%) translateY(140%)}
.fab .c-count{background:#fff;color:var(--verm);border-radius:8px;padding:3px 9px;font-size:13px;margin-right:10px}
.fab .c-total{font-family:'Anton';font-size:20px;letter-spacing:.5px}

/* OVERLAY + SHEET */
.overlay{position:fixed;inset:0;background:rgba(30,14,10,.55);z-index:70;opacity:0;pointer-events:none;transition:.2s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--card);border-radius:20px 20px 0 0;max-height:93vh;
  display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1)}
.sheet.on{transform:translateY(0)}
@media(min-width:620px){.sheet{left:50%;right:auto;transform:translate(-50%,100%);width:520px;border-radius:20px 20px 0 0}.sheet.on{transform:translate(-50%,0)}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sh-head h2{font-size:22px;color:var(--verm-d);text-transform:uppercase}
.sh-close{font-size:26px;color:var(--ink-soft);width:34px;height:34px}
.sh-body{overflow-y:auto;padding:6px 18px 10px}
.sh-foot{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}

/* MODAL BURGER */
.pz-img{width:100%;height:180px;object-fit:cover;border-radius:14px;margin:8px 0 4px}
.pz-desc{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-bottom:8px}
.opt-group{margin-top:16px}
.opt-group>label{display:block;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;color:var(--ink)}
.opt-row{display:flex;gap:9px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);border-radius:11px;padding:10px 13px;font-size:13.5px;font-weight:600;background:var(--card2);color:var(--ink);
  display:flex;align-items:center;gap:7px;transition:.15s}
.opt.sel{border-color:var(--verm);background:#fbece9;box-shadow:0 0 0 2px rgba(192,57,43,.12)}
.opt .pl{color:var(--ink-soft);font-weight:500;font-size:12px}
.combo-box{border:1.5px dashed var(--mostarda);border-radius:12px;padding:12px 13px;background:#fef6ea}
.combo-box .ct{font-size:13px;color:var(--ink);font-weight:600}
.combo-box .ct b{color:var(--verm-d)}
.combo-row{display:flex;gap:9px;margin-top:9px}
.combo-row .opt{flex:1;justify-content:center;background:var(--card)}
.obs-in{width:100%;margin-top:6px;font-size:13px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card2);color:var(--ink)}
.obs-in::placeholder{color:var(--ink-soft)}
.obs-in:focus,input:focus,select:focus{outline:none;border-color:var(--mostarda)}
.qty-big{display:flex;align-items:center;gap:14px;justify-content:center;margin:6px 0}
.qty-big button{width:42px;height:42px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);font-size:22px;font-weight:700;color:var(--verm)}
.qty-big span{font-family:'Anton';font-size:26px;min-width:30px;text-align:center}
.pz-add{width:100%;background:var(--verm);color:#fff;font-weight:700;font-size:16px;padding:15px;border-radius:13px;display:flex;justify-content:space-between;align-items:center}
.pz-add:active{transform:scale(.99)}

/* CART */
.citem{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.citem img,.citem .ni{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:none;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px}
.citem .ci-t{flex:1;min-width:0}
.citem .ci-t h4{font-size:14px;font-weight:700}
.citem .ci-t .cfg{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.35}
.citem .ci-r{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px}
.citem .lp{font-family:'Anton';font-size:16px;letter-spacing:.5px}
.suggest{background:#fef6ea;border:1px dashed var(--mostarda);border-radius:12px;padding:11px 13px;margin:12px 0 2px;font-size:13px}
.suggest b{color:var(--verm-d)}
.sug-row{display:flex;gap:8px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
.sug-row::-webkit-scrollbar{display:none}
.sug-chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:600;color:var(--ink)}
.sug-chip b{color:var(--verm)}
.sug-chip:active{transform:scale(.96)}
.frete{background:#fff6ea;border:1px solid #f0dcae;border-radius:12px;padding:10px 13px;margin:0 0 12px}
.frete-t{font-size:12.5px;font-weight:600;color:var(--ink)}
.frete-t b{color:var(--verm-d)}
.frete-bar{height:7px;background:#ecdfc6;border-radius:99px;margin-top:8px;overflow:hidden}
.frete-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--mostarda),var(--alface));border-radius:99px;transition:width .35s}
.frete.ok{background:#eef6ea;border-color:#cfe6c6}
.frete.ok .frete-t{color:var(--alface)}
.frete.ok .frete-t b{color:var(--alface)}
.up-hint{font-size:11.5px;color:var(--alface);font-weight:600;margin-top:8px}

.empty{text-align:center;color:var(--ink-soft);padding:46px 20px;font-size:14px}
.empty .em{font-size:42px;margin-bottom:8px}

.field{margin-top:14px}
.field>label{display:block;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px;color:var(--ink)}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.o2{border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:13px;font-weight:600;background:var(--card2);color:var(--ink);
  display:flex;flex-direction:column;gap:2px;text-align:left;line-height:1.2}
.o2 small{font-weight:500;color:var(--ink-soft);font-size:11px}
.o2.sel{border-color:var(--verm);background:#fbece9;box-shadow:0 0 0 2px rgba(192,57,43,.12)}
input.txt{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;font-size:14px;background:var(--card2);color:var(--ink)}
input.txt::placeholder{color:var(--ink-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pay3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.o2.center{align-items:center;text-align:center}
.tips{display:flex;gap:8px}
.tip{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:13px;font-weight:600;text-align:center;background:var(--card2);color:var(--ink)}
.tip.sel{border-color:var(--alface);background:#eef6ea;color:var(--alface)}
.coupon{display:flex;gap:8px;margin-top:8px}
.coupon input{flex:1}
.coupon button{background:var(--ink);color:#fff;border-radius:10px;padding:0 16px;font-weight:700;font-size:13px}
.coupon.ok input{border-color:var(--alface);background:#eef6ea}
.sumrow{display:flex;justify-content:space-between;font-size:13.5px;margin:5px 0;color:var(--ink-soft)}
.sumrow.disc{color:var(--alface);font-weight:600}
.totrow{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 12px;padding-top:10px;border-top:1px solid var(--line)}
.totrow .tv{font-family:'Anton';font-size:28px;letter-spacing:.5px}
.send{width:100%;background:var(--green);color:#063c1e;font-weight:700;font-size:16px;padding:15px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:9px}
.send:active{transform:scale(.99)}.send:disabled{background:#c9c2b4;color:#fff}
.send svg{width:20px;height:20px;fill:#063c1e}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.45}

.sobre{max-width:840px;margin:22px auto 0;padding:24px 20px 4px}
.sobre h2{font-size:22px;color:var(--verm-d);margin-bottom:10px;text-transform:uppercase}
.sobre p{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin-bottom:10px}
.sobre b{color:var(--ink);font-weight:600}
footer{background:var(--verm-d);color:#f6d9b6;text-align:center;padding:24px 18px 34px;font-size:12.5px;line-height:1.7;margin-top:14px}
footer b{color:#fff}
footer .fb{font-family:'Anton';font-size:24px;color:#fff;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);z-index:90;background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.pwa{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:55;width:min(92%,540px);display:none;
  background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;align-items:center;gap:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.pwa b{font-weight:700}
.pwa .in{flex:1}
.pwa button{background:var(--mostarda);color:#3a2408;font-weight:700;border-radius:9px;padding:8px 12px;font-size:13px}
.pwa .x{background:none;color:#bbb;padding:4px 8px;font-size:18px}

/* fix: no carrinho, formulario longo (endereco/data) deixava o botao de enviar fora da tela.
   restrito ao modo carrinho pra nao encolher a janela de montar o burger sem necessidade. */

.sheet.cart-mode .sh-foot .send{position:sticky;bottom:0;z-index:3;box-shadow:0 -10px 20px rgba(0,0,0,.18)}
</style>

<script>
/* ===================== DADOS DA LOJA =====================
   Tudo aqui vem do painel (admin.html). Para mudar cardápio, preços,
   cores ou horário, use o painel — não é preciso editar este arquivo. */
let CONFIG, MENU, PONTOS, ADICIONAIS, EMOJI, PAGAMENTOS, GORJETAS, ALL={};
const brl=v=>"R$ "+(Number(v)||0).toFixed(2).replace(".",",");

async function carregarDados(){
  // 1º tenta o servidor (é onde o dono publica), 2º o arquivo local
  try{
    const r = await NUVEM.carregarCardapio();
    if(r && r.dados && r.dados.produtos && r.dados.produtos.length) return r.dados;
  }catch(e){}
  const local = localStorage.getItem("bb_loja_dados");
  if(local){ try{ return JSON.parse(local); }catch(e){} }
  const r = await fetch("dados.json",{cache:"no-store"});
  return await r.json();
}

function aplicarDados(D){
  const L=D.loja||{}, C=D.cores||{};

  const cor=(k,v)=>C[k]&&document.documentElement.style.setProperty(v,C[k]);
  cor("principal","--verm"); cor("principalEscuro","--verm-d"); cor("destaque","--mostarda");
  cor("fundo","--bg"); cor("cartao","--card"); cor("texto","--ink");
  if(C.fundo){
    document.body.style.backgroundImage="none";
    document.querySelector('meta[name=theme-color]')?.setAttribute("content",C.fundo);
  }

  document.title = `${L.nome} — Peça pela internet`;
  document.getElementById("heroNome").textContent = L.nome||"";

  if(L.capa) document.getElementById("heroCapa").src = L.capa;

  const txt = (L.sobre||"").trim();
  document.getElementById("sobreTxt").innerHTML = txt
    ? txt.split(/\n\s*\n/).map(p=>`<p>${p.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</p>`).join("")
    : "";
  document.getElementById("sobre").style.display = txt ? "" : "none";

  const cupons={};
  (D.cupons||[]).filter(c=>c.ativo!==false).forEach(c=>{
    cupons[c.codigo] = {tipo:c.tipo, valor:c.valor, label:c.label || (c.tipo==="percent"?c.valor+"% de desconto":brl(c.valor)+" de desconto")};
  });

  CONFIG = {
    nome:L.nome||"", whatsapp:L.whatsapp||"", endereco:L.endereco||"", maps:L.maps||"",
    horario:D.horario||{dias:[],abre:"00:00",fecha:"23:59"},
    entrega:{taxa:D.entrega?.taxa||0, gratisAcima:D.entrega?.gratisAcima||0, ativa:D.entrega?.ativa!==false, retirada:D.entrega?.retirada!==false},
    combo:{ativo:!!D.combo?.ativo, preco:D.combo?.preco||0, label:D.combo?.label||"Combo", chamada:D.combo?.chamada||"Adicione o combo por só"},
    cupons
  };
  PONTOS = D.pontos||[];
  ADICIONAIS = (D.adicionais||[]).filter(a=>a.ativo!==false);
  GORJETAS = D.entrega?.gorjetas?.length ? D.entrega.gorjetas : [0,2,5];
  PAGAMENTOS = [["PIX","💠"],["Dinheiro","💵"],["Cartão","💳"]]
    .filter(([n])=>D.pagamento?.[n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")] !== false);

  EMOJI={};
  MENU = (D.categorias||[]).map(c=>{
    EMOJI[c.key] = c.emoji || "🍔";
    return { cat:c.nome, key:c.key, sub:c.sub||"", burger:!!c.montavel,
      items:(D.produtos||[]).filter(p=>p.cat===c.key && p.ativo!==false) };
  }).filter(c=>c.items.length);

  ALL={}; MENU.forEach(c=>c.items.forEach(i=>{i.cat=c.cat;i.catKey=c.key;i.burger=c.burger;ALL[i.id]=i}));
}

function horarioTexto(){
  const h=CONFIG.horario, d=h.dias||[];
  const nm=["dom","seg","ter","qua","qui","sex","sáb"];
  const faixa = `${h.abre.replace(":00","h").replace(":","h")}–${h.fecha.replace(":00","h").replace(":","h")}`;
  if(d.length===7) return `Todos os dias · ${faixa}`;
  if(!d.length) return "Consulte o horário";
  return `${d.map(x=>nm[x]).join(", ")} · ${faixa}`;
}

/* ===================== ESTADO ===================== */
let cart=[]; // linhas: burger -> {lineId,id,nome,base,burger:true,ponto,pontoNome,combo,adics[],adicsNome,precoUnit,qty,obs}
let order={tipo:"", pag:"", nome:"", tel:"", troco:"", cupom:"", gorjeta:0, end:{rua:"",num:"",bairro:"",comp:"",ref:""}};
let modal={item:null, ponto:"ponto", combo:false, adics:[], qty:1, obs:""};

/* ===================== HORÁRIO ===================== */
function statusLoja(){
  const now=new Date(); const dia=now.getDay();
  const [ah,am]=CONFIG.horario.abre.split(":").map(Number);
  const [fh,fm]=CONFIG.horario.fecha.split(":").map(Number);
  const min=now.getHours()*60+now.getMinutes();
  const aberto=CONFIG.horario.dias.includes(dia) && min>=ah*60+am && min<=fh*60+fm;
  let proximo="";
  if(!aberto){
    for(let i=0;i<7;i++){ const d=(dia+i)%7;
      if(CONFIG.horario.dias.includes(d)){
        if(i===0 && min<ah*60+am){ proximo="hoje às "+CONFIG.horario.abre; break; }
        if(i===0) continue;
        proximo=(i===1?"amanhã":["dom","seg","ter","qua","qui","sex","sáb"][d])+" às "+CONFIG.horario.abre; break;
      }
    }
  }
  return {aberto, proximo};
}

/* ===================== RENDER ===================== */
function renderMeta(){
  const s=statusLoja();
  document.getElementById("meta").innerHTML=`
    <span class="chip ${s.aberto?'status-open':'status-closed'}"><span class="dot ${s.aberto?'on':'off'}"></span>${s.aberto?'Aberto agora':'Fechado'}</span>
    ${CONFIG.maps?`<span class="chip"><a href="${CONFIG.maps}" target="_blank" rel="noopener">📍 Como chegar</a></span>`:""}
    <span class="chip">🕐 ${horarioTexto()}</span>`;
  document.getElementById("footAddr").textContent="📍 "+CONFIG.endereco;
  const cb=document.getElementById("closedBanner");
  if(!s.aberto){ cb.style.display="block"; cb.textContent="🕐 Estamos fechados agora. Abrimos "+(s.proximo||"em breve")+". Você pode montar o pedido e enviar quando abrirmos."; }
  else { cb.style.display="none"; }
}

function render(){
  const nav=document.getElementById("nav"), menu=document.getElementById("menu");
  nav.innerHTML=""; menu.innerHTML="";
  MENU.forEach((c,i)=>{
    const cid="cat-"+c.key;
    const a=document.createElement("a"); a.href="#"+cid; a.textContent=c.cat; a.dataset.cid=cid;
    if(i===0)a.classList.add("active"); nav.appendChild(a);
    const semImg=c.items.every(it=>!it.img);
    const sec=document.createElement("section"); sec.className="sec"+(semImg?" simple":""); sec.id=cid;
    sec.innerHTML=`<div class="sec-h"><h2>${c.cat}</h2>${c.sub?`<span class="sub">${c.sub}</span>`:""}</div>`;
    const g=document.createElement("div"); g.className="grid";
    c.items.forEach(it=>g.appendChild(cardEl(it)));
    sec.appendChild(g); menu.appendChild(sec);
  });
  syncCards();
}
function cardEl(it){
  const el=document.createElement("div"); el.className="card"; el.id="card-"+it.id;
  const thumb=it.img?`<img class="thumb" loading="lazy" src="${it.img}" alt="${it.n}">`:"";
  const preco=it.burger?`${brl(it.p)} <small>a partir de</small>`:brl(it.p);
  el.innerHTML=`${thumb}<div class="txt"><h3>${it.n}</h3>${it.d?`<div class="desc">${it.d}</div>`:`<div class="desc"></div>`}
    <div class="bot"><span class="price">${preco}</span><span id="act-${it.id}"></span></div></div>`;
  return el;
}
function actEl(it){
  if(it.burger) return `<button class="add" onclick="openBurger('${it.id}')">Montar</button>`;
  const q=qtySimple(it.id);
  if(q===0) return `<button class="add" onclick="addSimple('${it.id}')">Adicionar</button>`;
  return `<span class="qtc"><button onclick="decSimple('${it.id}')">−</button><span>${q}</span><button onclick="addSimple('${it.id}')">+</button></span>`;
}
function syncCards(){ MENU.forEach(c=>c.items.forEach(it=>{const s=document.getElementById("act-"+it.id); if(s)s.innerHTML=actEl(it);})); }

/* ===================== ITENS SIMPLES ===================== */
function qtySimple(id){ return cart.filter(l=>l.id===id&&!l.burger).reduce((s,l)=>s+l.qty,0); }
function addSimple(id){
  const it=ALL[id]; const line=cart.find(l=>l.id===id&&!l.burger);
  if(line) line.qty++;
  else cart.push({lineId:"L"+Date.now()+Math.round(Math.random()*999),id,nome:it.n,base:it.p,burger:false,precoUnit:it.p,qty:1,obs:""});
  onCartChange(); toast(it.n+" adicionado");
}
function decSimple(id){ const line=cart.find(l=>l.id===id&&!l.burger); if(!line)return; line.qty--; if(line.qty<=0)cart=cart.filter(l=>l!==line); onCartChange(); }

/* ===================== MODAL BURGER ===================== */
function openBurger(id){
  const it=ALL[id]; modal={item:it, ponto:"ponto", combo:false, adics:[], qty:1, obs:""};
  document.getElementById("shTitle").textContent=it.n;
  renderBurger(); openSheet("burger");
}
function adicSum(){ return modal.adics.reduce((s,a)=>s+(ADICIONAIS.find(x=>x.id===a)?.p||0),0); }
function burgerPreco(){
  let base=modal.item.p + (modal.combo?CONFIG.combo.preco:0) + adicSum();
  return base*modal.qty;
}
function toggleAdic(id){ const i=modal.adics.indexOf(id); if(i>=0)modal.adics.splice(i,1); else modal.adics.push(id); renderBurger(); }
function setPonto(p){ modal.ponto=p; renderBurger(); }
function setCombo(v){ modal.combo=v; renderBurger(); }

      <div class="qty-big"><button onclick="modal.qty=Math.max(1,modal.qty-1);renderBurger()">−</button><span>${modal.qty}</span><button onclick="modal.qty++;renderBurger()">+</button></div>

function renderBurgerFoot(){
  document.getElementById("shFoot").innerHTML=`
    <button class="pz-add" onclick="addBurger()">
      <span>Adicionar</span><span>${brl(burgerPreco())}</span></button>`;
}
function addBurger(){
  const it=modal.item;
  const adicsNome=modal.adics.map(a=>ADICIONAIS.find(x=>x.id===a).n);
  cart.push({
    lineId:"L"+Date.now()+Math.round(Math.random()*999), id:it.id, nome:it.n, base:it.p, burger:true,
    carne:it.carne, ponto:modal.ponto, pontoNome:PONTOS.find(p=>p.id===modal.ponto).n,
    combo:modal.combo, adics:[...modal.adics], adicsNome,
    precoUnit: burgerPreco()/modal.qty, qty:modal.qty, obs:modal.obs
  });
  closeAll(); onCartChange(); toast("Burger adicionado ao pedido");
}

/* ===================== TOTAIS ===================== */
function count(){ return cart.reduce((s,l)=>s+l.qty,0); }
function subtotal(){ return cart.reduce((s,l)=>s+l.precoUnit*l.qty,0); }
function descontoCupom(){ const c=CONFIG.cupons[order.cupom]; if(!c)return 0; return c.tipo==="percent"? subtotal()*c.valor/100 : c.valor; }
function taxaEntrega(){ if(order.tipo!=="entrega")return 0; const sub=subtotal()-descontoCupom(); return sub>=CONFIG.entrega.gratisAcima?0:CONFIG.entrega.taxa; }
function total(){ return Math.max(0, subtotal()-descontoCupom()+taxaEntrega()+(order.tipo==="entrega"?order.gorjeta:0)); }

function onCartChange(){
  syncCards(); persistCart();
  const n=count(); document.getElementById("fabCount").textContent=n;
  document.getElementById("fabTotal").textContent=brl(total());
  document.getElementById("fab").classList.toggle("hide",n===0);
  if(document.getElementById("sheet").classList.contains("on") && sheetMode==="cart") renderCart();
}

/* ===================== SHEET CTRL ===================== */
let sheetMode="";
function openSheet(m){ sheetMode=m||"burger"; document.getElementById("overlay").classList.add("on"); const sh=document.getElementById("sheet"); sh.classList.add("on"); sh.classList.toggle("cart-mode",sheetMode==="cart"); document.body.style.overflow="hidden"; }
function closeAll(){ document.getElementById("overlay").classList.remove("on"); document.getElementById("sheet").classList.remove("on"); document.body.style.overflow=""; sheetMode=""; }

/* ===================== CARRINHO ===================== */
function openCart(){ renderCart(); openSheet("cart"); }
function lineDesc(l){
  if(!l.burger) return l.obs?`obs: ${l.obs}`:"";
  const parts=[];
  if(l.carne) parts.push(l.pontoNome);
  if(l.combo) parts.push("Combo (batata + refri)");
  if(l.adicsNome&&l.adicsNome.length) parts.push("+ "+l.adicsNome.join(", "));
  if(l.obs) parts.push(l.obs);
  return parts.join(" · ");
}
function renderCart(){
  document.getElementById("shTitle").textContent="Seu pedido";
  const body=document.getElementById("shBody"), foot=document.getElementById("shFoot");
  if(!cart.length){ body.innerHTML=`<div class="empty"><div class="em">🍔</div>Seu pedido está vazio.<br>Monte seu burger no cardápio.</div>`; foot.innerHTML=""; return; }
  body.innerHTML = freteBlock() + cart.map(l=>{
    const it=ALL[l.id];
    const img = it.img?`<img src="${it.img}" alt="">`:`<div class="ni">${EMOJI[it.catKey]||"🍔"}</div>`;
    return `<div class="citem">${img}
      <div class="ci-t"><h4>${l.nome}</h4>
        <div class="cfg">${lineDesc(l)}</div></div>
      <div class="ci-r"><span class="lp">${brl(l.precoUnit*l.qty)}</span>

  }).join("") + suggestBlock();

  const s=statusLoja();
  foot.innerHTML=`
    <div class="field"><label>Como você quer receber?</label>
      <div class="opts2">
        ${CONFIG.entrega.ativa?`<button class="o2 ${order.tipo==='entrega'?'sel':''}" onclick="setTipo('entrega')">🛵 Entrega<small>na sua casa</small></button>`:""}
        ${CONFIG.entrega.retirada?`<button class="o2 ${order.tipo==='retirada'?'sel':''}" onclick="setTipo('retirada')">🏠 Retirada<small>no balcão</small></button>`:""}
      </div>
    </div>
    ${order.tipo==='entrega'?enderecoForm():""}
    <div class="field"><label>Seu nome</label><input class="txt" id="fNome" placeholder="Nome de quem recebe" value="${order.nome}" oninput="order.nome=this.value;updateSend()"></div>
    <div class="field"><label>Seu WhatsApp</label><input class="txt" id="fTel" inputmode="numeric" placeholder="(11) 90000-0000" value="${order.tel}" oninput="order.tel=this.value;updateSend()"></div>
    <div class="field"><label>Forma de pagamento</label>
      <div class="pay3">

      </div>
      ${order.pag==='Dinheiro'?`<input class="txt" style="margin-top:9px" placeholder="Troco para quanto? (opcional)" value="${order.troco}" oninput="order.troco=this.value">`:""}
    </div>
    ${order.tipo==='entrega'?`<div class="field"><label>Gorjeta pro entregador (opcional)</label>
      <div class="tips">${GORJETAS.map(v=>`<button class="tip ${order.gorjeta===v?'sel':''}" onclick="setGorjeta(${v})">${v===0?'Não':brl(v)}</button>`).join("")}</div></div>`:""}
    <div class="field"><label>Cupom de desconto</label>

    </div>
    <div style="margin-top:16px">

      ${order.tipo==='entrega'?`<div class="sumrow"><span>Taxa de entrega</span><span>${taxaEntrega()===0?'Grátis':brl(taxaEntrega())}</span></div>`:""}
      ${order.tipo==='entrega'&&order.gorjeta?`<div class="sumrow"><span>Gorjeta</span><span>${brl(order.gorjeta)}</span></div>`:""}
      <div class="totrow"><span style="font-weight:600">Total</span><span class="tv">${brl(total())}</span></div>

      ${s.aberto?'Enviar pedido no WhatsApp':'Enviar assim que abrir'}</button>
    <div class="hint">O pagamento e a confirmação são combinados na conversa do WhatsApp.</div>`;

/* sugestões que aumentam o ticket */
function leveJuntoChips(){
  const itens=MENU.filter(c=>!c.burger).flatMap(c=>c.items).slice(0,3);
  return itens.map(x=>`<button class="sug-chip" onclick="event.stopPropagation();addSimple('${x.id}')">+ ${x.n} <b>${brl(x.p)}</b></button>`).join("");
}
function suggestBlock(){
  const noCarrinho=id=>cart.some(l=>l.id===id);
  const chips=[];
  MENU.filter(c=>!c.burger).forEach(c=>{
    if(c.items.some(x=>noCarrinho(x.id))) return;
    c.items.slice(0,2).forEach(x=>{ if(chips.length<4) chips.push(x); });
  });
  if(!chips.length) return "";
  return `<div class="suggest"><b>Complete seu pedido</b>
    <div class="sug-row">${chips.map(x=>`<button class="sug-chip" onclick="addSimple('${x.id}')">+ ${x.n} <b>${brl(x.p)}</b></button>`).join("")}</div></div>`;
}
function freteBlock(){
  if(subtotal()<=0) return "";
  const base=subtotal()-descontoCupom();
  const falta=CONFIG.entrega.gratisAcima-base;
  if(falta>0.01){
    const pct=Math.min(100, base/CONFIG.entrega.gratisAcima*100);
    return `<div class="frete"><div class="frete-t">Faltam <b>${brl(falta)}</b> para ganhar <b>ENTREGA GRÁTIS</b></div><div class="frete-bar"><span style="width:${pct}%"></span></div></div>`;
  }
  return `<div class="frete ok"><div class="frete-t">Você ganhou <b>ENTREGA GRÁTIS</b>! Aproveite.</div></div>`;
}
function incLine(id){ const l=cart.find(x=>x.lineId===id); if(l){l.qty++;onCartChange();} }
function decLine(id){ const l=cart.find(x=>x.lineId===id); if(!l)return; l.qty--; if(l.qty<=0)cart=cart.filter(x=>x!==l); onCartChange(); }
function enderecoForm(){ const e=order.end; return `
  <div class="field"><label>Endereço de entrega</label>
    <div class="row2"><input class="txt" placeholder="Rua" value="${e.rua}" oninput="order.end.rua=this.value">
      <input class="txt" placeholder="Número" value="${e.num}" oninput="order.end.num=this.value"></div>
    <div class="row2" style="margin-top:9px"><input class="txt" placeholder="Bairro" value="${e.bairro}" oninput="order.end.bairro=this.value">
      <input class="txt" placeholder="Complemento" value="${e.comp}" oninput="order.end.comp=this.value"></div>
    <input class="txt" style="margin-top:9px" placeholder="Ponto de referência (opcional)" value="${e.ref}" oninput="order.end.ref=this.value">
  </div>`; }
function setTipo(t){ order.tipo=t; renderCart(); }
function setPag(p){ order.pag=p; renderCart(); }
function setGorjeta(v){ order.gorjeta=v; renderCart(); }
function aplicarCupom(){
  const code=(document.getElementById("fCupom").value||"").trim().toUpperCase();
  order.cupom=code;
  if(CONFIG.cupons[code]){ toast("Cupom aplicado: "+CONFIG.cupons[code].label); } else if(code){ toast("Cupom inválido"); order.cupom=""; }
  renderCart();
}
function updateSend(){ const b=document.getElementById("sendBtn"); if(!b)return;
  let ok = order.tipo && order.nome.trim() && order.tel.trim();
  if(order.tipo==="entrega") ok = ok && order.end.rua && order.end.num && order.end.bairro;
  b.disabled=!ok; }

/* ===================== ENVIO WHATSAPP ===================== */
async function enviar(){
  if(!order.tipo){toast("Escolha entrega ou retirada");return;}
  if(!order.nome.trim()){toast("Digite seu nome");return;}
  if(!order.tel.trim()){toast("Digite seu WhatsApp");return;}
  if(order.tipo==="entrega" && (!order.end.rua||!order.end.num||!order.end.bairro)){toast("Complete o endereço");return;}
  const codigo = codigoPedido();

  /* Espera o pedido salvar no painel da loja ANTES de abrir o WhatsApp.
     Sem isso, o celular às vezes troca de app rápido demais e cancela
     o salvamento no meio do caminho. Espera no máximo 2s — se a internet
     estiver ruim, manda pro WhatsApp assim mesmo (o pedido ali já vale). */
  const btn = document.getElementById("sendBtn");
  const txtOriginal = btn ? btn.innerHTML : "";
  if(btn){ btn.disabled = true; btn.innerHTML = "Enviando…"; }
  await Promise.race([ saveClient(codigo), new Promise(r=>setTimeout(r,2000)) ]);
  if(btn){ btn.disabled = false; btn.innerHTML = txtOriginal; }

  const L=[];
  L.push(`*PEDIDO #${codigo} — ${CONFIG.nome}*`); L.push("");
  L.push(`*Cliente:* ${order.nome.trim()}`);
  L.push(`*WhatsApp:* ${order.tel.trim()}`);
  if(order.tipo==="entrega"){
    const e=order.end;
    L.push(`*Entrega:* ${e.rua}, ${e.num}${e.comp?" - "+e.comp:""} - ${e.bairro}`);
    if(e.ref) L.push(`*Referência:* ${e.ref}`);
  } else L.push(`*Retirada no balcão*`);
  L.push(""); L.push("*Pedido:*");
  cart.forEach(l=>{
    if(l.burger){
      const nome = l.combo ? `${l.nome} — Combo (batata + refri)` : l.nome;
      L.push(`• ${l.qty}x ${nome} — ${brl(l.precoUnit*l.qty)}`);
      if(l.carne) L.push(`   ponto: ${l.pontoNome}`);
      if(l.adicsNome&&l.adicsNome.length) L.push(`   adicionais: ${l.adicsNome.join(", ")}`);
      if(l.obs) L.push(`   _${l.obs}_`);
    } else {
      L.push(`• ${l.qty}x ${l.nome} — ${brl(l.precoUnit*l.qty)}`);
      if(l.obs) L.push(`   _${l.obs}_`);
    }
  });
  L.push("");
  L.push(`*Subtotal:* ${brl(subtotal())}`);
  if(descontoCupom()>0) L.push(`*Cupom ${order.cupom}:* -${brl(descontoCupom())}`);
  if(order.tipo==="entrega") L.push(`*Taxa de entrega:* ${taxaEntrega()===0?"Grátis":brl(taxaEntrega())}`);
  if(order.tipo==="entrega" && order.gorjeta) L.push(`*Gorjeta:* ${brl(order.gorjeta)}`);
  L.push(`*TOTAL:* ${brl(total())}`);
  if(order.pag) L.push(`*Pagamento:* ${order.pag}${order.pag==="Dinheiro"&&order.troco?` (troco p/ ${order.troco})`:""}`);
  L.push(""); L.push("_Pedido feito pelo site_");
  localStorage.setItem("bb_last", JSON.stringify({cart, order:{...order}}));
  localStorage.setItem("bb_nome", order.nome.trim());
  localStorage.setItem("bb_tel", order.tel.trim());
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=`+encodeURIComponent(L.join("\n")),"_blank");
}

/* Envia o pedido para o painel da loja (é o que faz tocar o alerta lá).
   Silencioso: se a internet falhar, o pedido do WhatsApp continua valendo. */
function codigoPedido(){
  return Math.random().toString(36).slice(2,7).toUpperCase();
}
function saveClient(codigo){
  try{
    return NUVEM.enviarPedido({
      codigo,
      cliente: order.nome.trim(),
      telefone: order.tel.trim(),
      tipo: order.tipo,
      endereco: order.tipo==="entrega" ? order.end : {},
      itens: cart.map(l=>({ nome:l.nome, qty:l.qty, preco:l.precoUnit*l.qty, detalhes:lineDesc(l), obs:l.obs||"" })),
      subtotal: subtotal(),
      desconto: descontoCupom(),
      taxa: taxaEntrega(),
      gorjeta: order.tipo==="entrega" ? order.gorjeta : 0,
      total: total(),
      pagamento: order.pag || "",
      troco: order.troco || "",
      cupom: order.cupom || ""
    }).catch(()=>{});
  }catch(e){}
}

/* ===================== REPETIR PEDIDO / NOME ===================== */
function persistCart(){ localStorage.setItem("bb_cart", JSON.stringify(cart)); }
function initRepeat(){
  const nome=localStorage.getItem("bb_nome"); if(nome){ order.nome=nome; order.tel=localStorage.getItem("bb_tel")||""; }
  const last=localStorage.getItem("bb_last");
  if(last){ try{ const d=JSON.parse(last); if(d.cart&&d.cart.length){
    const btn=document.getElementById("repeatBtn"); btn.style.display="block";
    const resumo=d.cart.map(l=>l.qty+"x "+l.nome).slice(0,2).join(", ");
    btn.innerHTML=`🔁 Repetir último pedido <b>· ${resumo}${d.cart.length>2?"…":""}</b>`;
  }}catch(e){} }
}
function repeatLast(){
  const last=localStorage.getItem("bb_last"); if(!last)return;
  try{ const d=JSON.parse(last); cart=d.cart.map(l=>({...l,lineId:"L"+Date.now()+Math.round(Math.random()*9999)}));
    if(d.order){ order.nome=d.order.nome||order.nome; order.tel=d.order.tel||order.tel; order.tipo=d.order.tipo||""; order.end=d.order.end||order.end; }
    onCartChange(); openCart(); toast("Pedido anterior carregado");
  }catch(e){}
}

/* ===================== DEEP LINK ?item= ===================== */
function initDeepLink(){
  const p=new URLSearchParams(location.search).get("item");
  if(p && ALL[p]){ setTimeout(()=>{ if(ALL[p].burger) openBurger(p); else { addSimple(p); openCart(); } },350); }
}

/* ===================== SCROLLSPY ===================== */
function initSpy(){
  const links=[...document.querySelectorAll(".nav a")];
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
    links.forEach(l=>l.classList.toggle("active",l.dataset.cid===e.target.id));
    const al=links.find(l=>l.dataset.cid===e.target.id); if(al)al.scrollIntoView({inline:"center",block:"nearest"});
  }})},{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll(".sec").forEach(s=>io.observe(s));
}

/* ===================== PWA ===================== */
let deferredPrompt=null;
const ehMobile = window.matchMedia("(max-width: 768px)").matches || window.matchMedia("(pointer: coarse)").matches;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; if(ehMobile){ document.getElementById("pwaBar").style.display="flex"; } });
function installPWA(){ if(!deferredPrompt)return; deferredPrompt.prompt(); deferredPrompt=null; document.getElementById("pwaBar").style.display="none"; }
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }

/* ===================== toast ===================== */
let tt; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),1700); }

(async function boot(){
  aplicarDados(await carregarDados());
  renderMeta(); render(); initSpy(); initRepeat(); initDeepLink();
  setInterval(renderMeta,60000);
})();
